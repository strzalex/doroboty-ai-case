name: Bug
description: Describe a reproducible problem.
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page, actions, and mode — demo or Supabase.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, and Node version. Do not include secrets or user data.
