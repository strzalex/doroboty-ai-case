project_id = "doroboty-ai-case"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**", "http://127.0.0.1:3107/**"]
enable_signup = true
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1s"
[auth.email.template.confirmation]
subject = "Potwierdź konto DoRoboty.ai"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Zresetuj hasło DoRoboty.ai"
content_path = "./supabase/templates/recovery.html"
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100
[storage]
enabled = false
[realtime]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
